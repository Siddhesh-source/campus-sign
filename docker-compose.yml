services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: campusign
      POSTGRES_PASSWORD: campusign
      POSTGRES_DB: campusign
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusign"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
